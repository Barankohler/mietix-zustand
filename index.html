<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mietix Fahrzeugzustand</title>
<style>
:root{--rot:#C4161C;--dunkel:#2E2E30;--rand:#E2E2E4;--grau:#6F6F72;--bg:#F2F2F4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--dunkel);-webkit-text-size-adjust:100%}
header{background:var(--dunkel);color:#fff;border-bottom:3px solid var(--rot);
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px}
header h1{font-size:15px;letter-spacing:1.2px;font-weight:800}
header h1 span{color:var(--rot)}
main{max-width:640px;margin:0 auto;padding:16px 16px 0}

.zettel{background:#fff;border-radius:20px;padding:6px 18px 14px;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.045)}
.auto{font-size:17px;font-weight:800;letter-spacing:-.2px;padding:15px 0 2px;
  border-top:1px solid #EDEDEF}
.zettel .auto:first-child{border-top:0;padding-top:10px}
.p{display:flex;gap:11px;align-items:flex-start;padding:8px 0;cursor:pointer}
.p::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;
  background:var(--rot);margin-top:8px}
.p span{font-size:16.5px;line-height:1.42;font-weight:600;word-break:break-word}
.p.fertig::before{background:#CFCFD4}
.p.fertig span{text-decoration:line-through;color:#A8A8AE;font-weight:500}
.ok{font-size:13px;color:var(--grau);line-height:1.5;padding:13px 6px 0;
  font-weight:600;text-align:center}
.leer{text-align:center;color:var(--grau);font-size:16px;font-weight:600;padding:34px 10px}

.fuss{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;
  padding:16px 10px 0;margin-bottom:96px}
.fuss a{font-size:13px;font-weight:800;color:var(--grau);cursor:pointer;
  text-decoration:none;border-bottom:1px solid #D4D4D8;padding-bottom:1px}
#sicherbox{max-width:640px;margin:0 auto 96px;padding:0 16px;display:none}
#sicherung{width:100%;min-height:92px;border:1px solid var(--rand);border-radius:14px;
  padding:12px 14px;font:400 13px inherit;font-family:inherit;background:#fff}
#sicherbox .knoepfe{display:flex;gap:9px;margin-top:9px}
#sicherbox button{flex:1;padding:13px;border:1px solid var(--rand);border-radius:13px;
  background:#fff;color:var(--dunkel);font:800 14px inherit;min-height:48px}

.leiste{position:fixed;left:0;right:0;bottom:0;background:#fff;
  border-top:1px solid var(--rand);padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:center}
.leiste select{flex:0 0 118px;min-width:0;border:1px solid var(--rand);border-radius:14px;
  padding:13px 8px 13px 12px;font:800 14px inherit;color:var(--dunkel);background:#fff;
  height:50px;text-overflow:ellipsis}
.leiste input{flex:1;min-width:0;border:1px solid var(--rand);border-radius:14px;
  padding:13px 14px;font:600 16px inherit;color:var(--dunkel);height:50px}
.leiste input:focus,.leiste select:focus{outline:2px solid var(--dunkel);outline-offset:-2px}
.leiste button{flex:0 0 50px;height:50px;border:0;border-radius:50%;background:var(--rot);
  color:#fff;font-size:27px;font-weight:300;line-height:1;padding:0 0 3px}
</style></head><body>
<header><h1>MIETIX <span>FAHRZEUGZUSTAND</span></h1></header>
<main><div class="zettel" id="zettel"></div>
<p class="ok" id="ok"></p>
<div class="fuss">
  <a id="senden">Liste senden</a>
  <a id="aufraeumen">Erledigte weg</a>
  <a id="abgleich">Abgleichen</a>
</div></main>
<div id="sicherbox">
  <textarea id="sicherung" placeholder="Hier erscheint die Sicherung, oder hier einfügen zum Einlesen"></textarea>
  <div class="knoepfe">
    <button id="ausgeben">Alles sichern</button>
    <button id="einlesen">Sicherung einlesen</button>
  </div>
</div>
<div class="leiste">
  <select id="auto"></select>
  <input id="was" type="text" placeholder="Was ist?" autocomplete="off" enterkeyhint="done">
  <button id="plus">+</button>
</div>
<script>
const $=id=>document.getElementById(id);
let AUTOS=["Audi RS Q8"];

function heute(){ const d=new Date();
  return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear(); }
function sicher(t){ return t.replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])); }

function lesen(){
  let a=[];
  try{ a=JSON.parse(localStorage.getItem("mietixZustand")||"[]"); }catch(e){ return []; }
  if(!Array.isArray(a)) return [];
  return a.map(m=>{
    if(typeof m.text==="string") return m;   // aeltere Fassungen uebernehmen
    const t=[m.teil||"", m.was||""].filter(Boolean).join(" ");
    return { id:m.id, auto:m.auto, text:t, erledigt:(m.stand==="erledigt"), datum:m.datum||heute() };
  }).filter(m=>m&&m.id&&m.auto&&m.text);
}
function schreiben(a){ try{ localStorage.setItem("mietixZustand",JSON.stringify(a)); }catch(e){} }
function reihenfolge(){
  const alle=lesen();
  return AUTOS.concat([...new Set(alle.map(m=>m.auto))].filter(n=>!AUTOS.includes(n)));
}

function zeichnen(){
  const alle=lesen();
  let h="";
  reihenfolge().forEach(n=>{
    const l=alle.filter(m=>m.auto===n);
    if(!l.length) return;
    l.sort((a,b)=>(a.erledigt?1:0)-(b.erledigt?1:0));
    h+='<div class="auto">'+sicher(n)+'</div>'
      +l.map(m=>'<div class="p'+(m.erledigt?" fertig":"")+'" data-id="'+m.id+'">'
        +'<span>'+sicher(m.text)+'</span></div>').join("");
  });
  const ohne=AUTOS.filter(n=>!alle.some(m=>m.auto===n&&!m.erledigt));
  $("ok").textContent = (h && ohne.length) ? "In Ordnung: "+ohne.join(", ") : "";
  $("zettel").innerHTML = h ||
    '<div class="leer">Noch nichts eingetragen.<br>Unten Fahrzeug wählen und losschreiben.</div>';
  document.querySelectorAll(".p").forEach(e=>{
    e.onclick=()=>{ const a=lesen(), t=a.find(x=>x.id===e.dataset.id);
      if(t){ t.erledigt=!t.erledigt; schreiben(a); zeichnen(); } };
  });
}

function eintragen(){
  const t=$("was").value.trim();
  if(!t){ $("was").focus(); return; }
  const a=lesen();
  a.push({ id:String(Date.now())+Math.random().toString(36).slice(2,6),
    auto:$("auto").value, text:t, erledigt:false, datum:heute() });
  schreiben(a);
  $("was").value="";
  try{ localStorage.setItem("mietixZustandAuto",$("auto").value); }catch(e){}
  zeichnen();
}
$("plus").onclick=eintragen;
$("was").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); eintragen(); }});

$("senden").onclick=()=>{
  const offen=lesen().filter(m=>!m.erledigt);
  let t="*Mietix Fahrzeuge, Stand "+heute()+"*\n";
  reihenfolge().forEach(n=>{
    const l=offen.filter(m=>m.auto===n);
    if(!l.length) return;
    t+="\n*"+n+"*\n";
    l.forEach(m=>{ t+="- "+m.text+"\n"; });
  });
  const ohne=AUTOS.filter(n=>!offen.some(m=>m.auto===n));
  if(!offen.length) t+="\nNichts offen. Alle Fahrzeuge sind in Ordnung.";
  else if(ohne.length) t+="\nIn Ordnung: "+ohne.join(", ");
  window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");
};

$("aufraeumen").onclick=()=>{
  const weg=lesen().filter(m=>m.erledigt).length;
  if(!weg){ alert("Es ist nichts abgehakt."); return; }
  if(!confirm(weg+(weg===1?" abgehakter Punkt":" abgehakte Punkte")+" werden gelöscht.")) return;
  schreiben(lesen().filter(m=>!m.erledigt)); zeichnen();
};

$("abgleich").onclick=()=>{
  const b=$("sicherbox");
  b.style.display = b.style.display==="block" ? "none" : "block";
  if(b.style.display==="block") b.scrollIntoView({behavior:"smooth",block:"center"});
};
$("ausgeben").onclick=()=>{
  $("sicherung").value=JSON.stringify(lesen());
  $("ausgeben").textContent="Steht oben";
  setTimeout(()=>{$("ausgeben").textContent="Alles sichern";},1800);
};
$("einlesen").onclick=()=>{
  let neu=null;
  try{ neu=JSON.parse($("sicherung").value); }catch(e){}
  if(!Array.isArray(neu)){ alert("Da steht keine gültige Sicherung."); return; }
  const a=lesen(), bekannt=new Set(a.map(x=>x.id));
  let dazu=0;
  neu.forEach(x=>{ if(x&&x.id&&!bekannt.has(x.id)){ a.push(x); dazu++; } });
  schreiben(a); zeichnen();
  alert(dazu+(dazu===1?" Punkt":" Punkte")+" dazugekommen.");
};

function autosFuellen(){
  let merk=""; try{ merk=localStorage.getItem("mietixZustandAuto")||""; }catch(e){}
  const vorher=$("auto").value||merk;
  $("auto").innerHTML=AUTOS.map(n=>'<option>'+sicher(n)+'</option>').join("");
  if(vorher && AUTOS.includes(vorher)) $("auto").value=vorher;
}
autosFuellen(); zeichnen();
try{
  fetch("https://barankohler.github.io/mietix-preise/preise.json",{cache:"no-store"})
    .then(r=>r.ok?r.json():null)
    .then(p=>{ if(p&&p.cars&&p.cars.length){ AUTOS=p.cars.map(c=>c.anzeige||c.n);
      autosFuellen(); zeichnen(); } })
    .catch(()=>{});
}catch(e){}
</script></body></html>
