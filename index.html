<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mietix Fahrzeugzustand</title>
<style>
:root{--rot:#C4161C;--dunkel:#2E2E30;--rand:#E2E2E4;--grau:#6F6F72;--bg:#F2F2F4;--gruen:#1B8A4B}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--dunkel);padding-bottom:40px;-webkit-text-size-adjust:100%}
header{background:var(--dunkel);color:#fff;border-bottom:3px solid var(--rot);
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px}
header h1{font-size:15px;letter-spacing:1.2px;font-weight:800}
header h1 span{color:var(--rot)}
main{max-width:640px;margin:0 auto;padding:16px 18px 0}
.feldname{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--grau);
  margin:0 0 8px 3px;font-weight:800}
.block{margin-bottom:18px}
.karte{background:#fff;border-radius:20px;padding:14px;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.045)}
select,input{width:100%;background:#fff;border:1px solid var(--rand);border-radius:14px;
  padding:14px 15px;font:800 17px inherit;color:var(--dunkel);min-height:54px}
select:focus,input:focus{outline:2px solid var(--dunkel);outline-offset:-2px}
.eingabe select{margin-bottom:8px}
.eingabe .reihe{display:flex;gap:8px}
.eingabe .reihe input{flex:1;min-width:0}
.eingabe .reihe button{width:auto;flex:none;margin-top:0;padding:14px 20px}
button{width:100%;padding:16px;font:800 17px inherit;border:0;border-radius:14px;
  background:var(--rot);color:#fff;margin-top:9px;min-height:54px}
button.hell{background:#fff;color:var(--dunkel);border:1px solid var(--rand)}

.gruppe{margin-bottom:14px}
.gkopf{display:flex;align-items:baseline;gap:8px;margin:0 3px 7px}
.gkopf b{font-size:17px;font-weight:800;letter-spacing:-.2px}
.gkopf i{font-style:normal;font-size:13px;font-weight:800;color:var(--grau)}
.liste{background:#fff;border-radius:18px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.045)}
.zeile{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid #F0F0F2}
.zeile:first-child{border-top:0}
.haken{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #C9C9CE;
  background:#fff;cursor:pointer;position:relative}
.haken.an{background:var(--gruen);border-color:var(--gruen)}
.haken.an::after{content:"";position:absolute;left:8px;top:3.5px;width:6px;height:12px;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(43deg)}
.was{flex:1;font-size:16px;line-height:1.4;font-weight:600;word-break:break-word}
.zeile.fertig .was{text-decoration:line-through;color:var(--grau);font-weight:500}
.weg{flex:none;color:#C4C4CA;font-size:19px;font-weight:800;cursor:pointer;padding:4px 2px 4px 8px}

.frei{font-size:13.5px;color:var(--grau);line-height:1.55;padding:0 4px;margin-bottom:16px}
.frei b{color:var(--gruen);font-weight:800}
.leer{text-align:center;color:var(--grau);font-size:15px;font-weight:600;padding:22px 10px}
details{margin-bottom:16px}
summary{list-style:none;cursor:pointer;font-size:12px;text-transform:uppercase;
  letter-spacing:.9px;color:var(--grau);font-weight:800;padding:7px 3px}
summary::-webkit-details-marker{display:none}
summary::after{content:" anzeigen";color:#A6A6AC}
details[open] summary::after{content:" ausblenden"}
details .karte{margin-top:6px}
#sicherung{font-size:13px;font-weight:400;min-height:84px;padding:12px 14px;
  border-radius:14px;border:1px solid var(--rand);width:100%;margin-top:10px;
  font-family:inherit}
footer{max-width:640px;margin:14px auto 0;padding:0 20px;font-size:12px;color:var(--grau);
  line-height:1.55}
</style></head><body>
<header><h1>MIETIX <span>FAHRZEUGZUSTAND</span></h1></header>
<main>

<div class="block">
  <div class="karte eingabe">
    <select id="auto"></select>
    <div class="reihe">
      <input id="was" type="text" placeholder="z. B. Bremsen fällig"
        autocomplete="off" enterkeyhint="done">
      <button id="speichern">Eintragen</button>
    </div>
  </div>
</div>

<div class="block">
  <p class="feldname">Offene Punkte</p>
  <div id="liste"></div>
  <p class="frei" id="frei"></p>
  <button id="senden" class="hell">Liste als Text senden</button>
</div>

<details id="fertigBox">
  <summary id="fertigKopf">Erledigt</summary>
  <div id="fertig"></div>
</details>

<details>
  <summary>Mit dem Bruder abgleichen</summary>
  <div class="karte">
    <button id="ausgeben" class="hell">Alles sichern</button>
    <button id="einlesen" class="hell">Sicherung einlesen</button>
    <textarea id="sicherung" placeholder="Hier erscheint die Sicherung, oder hier einfügen zum Einlesen"></textarea>
  </div>
</details>

</main>
<footer>Die Einträge liegen auf diesem Handy.</footer>
<script>
const $=id=>document.getElementById(id);
let AUTOS=["Audi RS Q8"];

function heute(){ const d=new Date();
  return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear(); }

function lesen(){
  let a=[];
  try{ a=JSON.parse(localStorage.getItem("mietixZustand")||"[]"); }catch(e){ return []; }
  if(!Array.isArray(a)) return [];
  // Aeltere Eintraege mit Bauteil und Stand auf den einfachen Satz umstellen
  return a.map(m=>{
    if(typeof m.text==="string") return m;
    const t=[m.teil||"", m.was||""].filter(Boolean).join(" ");
    return { id:m.id, auto:m.auto, text:t, erledigt:(m.stand==="erledigt"), datum:m.datum||heute() };
  }).filter(m=>m&&m.id&&m.auto&&m.text);
}
function schreiben(a){ try{ localStorage.setItem("mietixZustand",JSON.stringify(a)); }catch(e){} }

function zeilen(liste,fertig){
  return '<div class="liste">'+liste.map(m=>
    '<div class="zeile'+(fertig?" fertig":"")+'" data-id="'+m.id+'">'
    +'<span class="haken'+(fertig?" an":"")+'"></span>'
    +'<span class="was">'+m.text.replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))+'</span>'
    +'<span class="weg">&#10005;</span></div>').join("")+'</div>';
}

function zeichnen(){
  const alle=lesen();
  const offen=alle.filter(m=>!m.erledigt);
  const fertig=alle.filter(m=>m.erledigt);

  let h="";
  AUTOS.forEach(n=>{
    const l=offen.filter(m=>m.auto===n);
    if(!l.length) return;
    h+='<div class="gruppe"><div class="gkopf"><b>'+n+'</b><i>'+l.length+'</i></div>'
      +zeilen(l,false)+'</div>';
  });
  // Fahrzeuge, die nicht in der Preisdatei stehen, trotzdem zeigen
  const fremd={};
  offen.filter(m=>!AUTOS.includes(m.auto)).forEach(m=>{(fremd[m.auto]=fremd[m.auto]||[]).push(m);});
  Object.keys(fremd).forEach(n=>{
    h+='<div class="gruppe"><div class="gkopf"><b>'+n+'</b><i>'+fremd[n].length+'</i></div>'
      +zeilen(fremd[n],false)+'</div>';
  });
  $("liste").innerHTML = h || '<div class="karte leer">Nichts offen. Alle Fahrzeuge sind in Ordnung.</div>';

  const ohne=AUTOS.filter(n=>!offen.some(m=>m.auto===n));
  $("frei").innerHTML = (ohne.length && h)
    ? '<b>Nichts offen:</b> '+ohne.join(", ") : "";

  $("fertigBox").style.display = fertig.length ? "block" : "none";
  $("fertigKopf").textContent = "Erledigt ("+fertig.length+")";
  $("fertig").innerHTML = fertig.length ? zeilen(fertig,true) : "";

  document.querySelectorAll(".zeile").forEach(e=>{
    const id=e.dataset.id;
    e.querySelector(".haken").onclick=()=>{
      const a=lesen(), t=a.find(x=>x.id===id);
      if(t){ t.erledigt=!t.erledigt; schreiben(a); zeichnen(); }
    };
    e.querySelector(".weg").onclick=()=>{
      if(!confirm("Diesen Punkt löschen?")) return;
      schreiben(lesen().filter(x=>x.id!==id)); zeichnen();
    };
  });
}

function eintragen(){
  const t=$("was").value.trim();
  if(!t){ $("was").focus(); return; }
  const a=lesen();
  a.push({ id:String(Date.now())+Math.random().toString(36).slice(2,6),
    auto:$("auto").value, text:t, erledigt:false, datum:heute() });
  schreiben(a);
  $("was").value="";
  try{ localStorage.setItem("mietixZustandAuto",$("auto").value); }catch(e){}
  zeichnen();
  $("speichern").textContent="Steht";
  setTimeout(()=>{$("speichern").textContent="Eintragen";},1100);
}
$("speichern").onclick=eintragen;
$("was").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); eintragen(); }});

$("senden").onclick=()=>{
  const offen=lesen().filter(m=>!m.erledigt);
  let t="*Mietix Fahrzeuge, Stand "+heute()+"*\n";
  const namen=AUTOS.concat([...new Set(offen.map(m=>m.auto))].filter(n=>!AUTOS.includes(n)));
  namen.forEach(n=>{
    const l=offen.filter(m=>m.auto===n);
    if(!l.length) return;
    t+="\n*"+n+"*\n";
    l.forEach(m=>{ t+="- "+m.text+"\n"; });
  });
  const ohne=AUTOS.filter(n=>!offen.some(m=>m.auto===n));
  if(!offen.length) t+="\nNichts offen. Alle Fahrzeuge sind in Ordnung.";
  else if(ohne.length) t+="\nNichts offen: "+ohne.join(", ");
  window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");
};

$("ausgeben").onclick=()=>{
  $("sicherung").value=JSON.stringify(lesen());
  $("ausgeben").textContent="Unten steht die Sicherung";
  setTimeout(()=>{$("ausgeben").textContent="Alles sichern";},1800);
};
$("einlesen").onclick=()=>{
  let neu=null;
  try{ neu=JSON.parse($("sicherung").value); }catch(e){}
  if(!Array.isArray(neu)){ alert("Da steht keine gültige Sicherung."); return; }
  const a=lesen(), bekannt=new Set(a.map(x=>x.id));
  let dazu=0;
  neu.forEach(x=>{ if(x&&x.id&&!bekannt.has(x.id)){ a.push(x); dazu++; } });
  schreiben(a); zeichnen();
  alert(dazu+(dazu===1?" Punkt":" Punkte")+" dazugekommen.");
};

function autosFuellen(){
  let merk=""; try{ merk=localStorage.getItem("mietixZustandAuto")||""; }catch(e){}
  const vorher=$("auto").value||merk;
  $("auto").innerHTML=AUTOS.map(n=>'<option>'+n+'</option>').join("");
  if(vorher && AUTOS.includes(vorher)) $("auto").value=vorher;
}
autosFuellen(); zeichnen();
try{
  fetch("https://barankohler.github.io/mietix-preise/preise.json",{cache:"no-store"})
    .then(r=>r.ok?r.json():null)
    .then(p=>{ if(p&&p.cars&&p.cars.length){ AUTOS=p.cars.map(c=>c.anzeige||c.n);
      autosFuellen(); zeichnen(); } })
    .catch(()=>{});
}catch(e){}
</script></body></html>
